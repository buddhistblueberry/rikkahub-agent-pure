name: build

on:
  push:
    branches:
      - master
      - 'feat/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain versions
        run: |
          java -version
          bun --version
          pnpm --version

      # web-ui/bun.lock is not committed upstream (only pnpm-lock.yaml is), while
      # web/build.gradle.kts installWebUiDeps runs `bun install --frozen-lockfile`.
      # Bootstrap it the same way a local checkout does, by letting bun migrate the pins.
      - name: Bootstrap web-ui lockfile
        working-directory: web-ui
        run: |
          if [ -f bun.lock ]; then
            echo "bun.lock present"
          else
            echo "bun.lock missing -> generating from pnpm-lock.yaml pins"
            bun install
          fi

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
